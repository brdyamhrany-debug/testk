<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فرم سفارش و تماس</title>
<style>
  body{font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff}
  .card{background:rgba(255,255,255,.08);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:30px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
  h1{margin:0 0 10px;font-size:24px}
  p.info{background:rgba(255,193,7,.15);border:1px solid rgba(255,193,7,.4);padding:10px;border-radius:12px;font-size:14px;line-height:1.8}
  input,textarea{width:100%;box-sizing:border-box;margin:10px 0;padding:14px;border-radius:12px;border:none;outline:none;font-family:inherit;font-size:15px}
  button{width:100%;padding:15px;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;background:linear-gradient(90deg,#00e676,#00b0ff);color:#fff;margin-top:10px}
  button:hover{opacity:.9}
  small{display:block;margin-top:15px;color:#ccc;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h1>ثبت سفارش</h1>
<p class="info">توجه: اطلاعاتی که وارد می‌کنید با رضایت شما برای مدیر همین سایت ارسال می‌شود.</p>
<form action="https://formsubmit.co/brdyamhrany@gmail.com" method="POST">
<input type="text" name="name" placeholder="نام شما" required />
<input type="text" name="order" placeholder="متن سفارش یا پیام شما" required />
<textarea name="message" rows="4" placeholder="توضیح بیشتر"></textarea>
<input type="hidden" name="_subject" value="سفارش جدید از سایت!" />
<input type="hidden" name="_template" value="table" />
<input type="hidden" name="_captcha" value="false" />
<button type="submit">ارسال سفارش</button>
</form>
<small>ارسال از طریق سرویس رایگان FormSubmit</small>
</div>
</body>
</html>
